[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "microsurg-ai-wave-r2i"
version = "0.1.0"
description = "Wave-R2I: Wavelet-Enhanced Deep Vision for Sub-Millimeter Tool Perception in Robotic Surgery (Expanding the Zooming-without-Zooming Framework)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Layaa Vishwakarma", email = "m25csa017@iitj.ac.in" },
    { name = "Eshani Ravindra Sawant", email = "m25cse012@iitj.ac.in" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "transformers>=4.37.0",
    "peft>=0.7.0",
    "bitsandbytes>=0.42.0",
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
    "Pillow>=9.5.0",
    "PyWavelets>=1.4.0",
    "scikit-learn>=1.2.0",
]
